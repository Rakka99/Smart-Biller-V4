name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify web dependencies
        working-directory: apps/web
        run: |
          npm ls @capacitor/core @capacitor/android @capacitor/cli react react-dom vite typescript --depth=0
          npx cap --version

      - name: TypeScript and Vite build
        working-directory: apps/web
        run: npm run build

      - name: Verify web output
        working-directory: apps/web
        run: test -f dist/index.html

      - name: Add Capacitor Android platform
        working-directory: apps/web
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android toolchain
        run: |
          java -version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Build debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          test -s apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apps/web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-biller-v4-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
