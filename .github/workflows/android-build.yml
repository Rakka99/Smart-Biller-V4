name: Smart Biller Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smart-biller-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f android-app/build.gradle.kts
          test -f android-app/src/main/AndroidManifest.xml
          test -f android-app/src/main/java/id/smartbiller/app/MainActivity.kt

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager --list_installed | head -n 80

      - name: Stop stale Gradle daemons
        run: gradle --stop || true

      - name: Resolve and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :android-app:clean :android-app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache \
            --refresh-dependencies \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-biller-native-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 14
