name: Smart Biller Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smart-biller-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f android-app/build.gradle.kts
          test -f android-app/src/main/AndroidManifest.xml
          test -f android-app/src/main/java/id/smartbiller/app/MainActivity.kt

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          test -x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :android-app:clean :android-app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache \
            --refresh-dependencies \
            --console=plain 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-biller-gradle-diagnostics-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-biller-native-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 14
