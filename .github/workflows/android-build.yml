name: Smart Biller Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smart-biller-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-37|build-tools;36.0.0' || true

      - name: Build native debug APK
        run: gradle :android-app:assembleDebug --stacktrace --no-daemon --warning-mode all

      - name: Verify APK
        run: |
          test -s android-app/build/outputs/apk/debug/android-app-debug.apk
          ls -lh android-app/build/outputs/apk/debug/android-app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-biller-native-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 14
