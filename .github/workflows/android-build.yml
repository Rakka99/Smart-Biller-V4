name: BMAX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bmax-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: false
          cache-overwrite-existing: true
          cache-cleanup: always

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f android-app/build.gradle.kts
          test -f android-app/src/main/AndroidManifest.xml
          test -f android-app/src/main/java/id/bmax/app/BmaxActivity.kt
          test -f android-app/src/main/java/id/bmax/app/domain/BmaxDomain.kt
          test -f android-app/src/main/java/id/smartbiller/app/data/SupabaseAuthRepository.kt
          test -f android-app/src/main/java/id/smartbiller/app/data/SupabaseClientProvider.kt
          test -f android-app/src/main/res/drawable/ic_launcher.xml
          test -s android-app/build.gradle.kts
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "::warning::MAPS_API_KEY GitHub Secret is not configured. Google Maps will not authenticate."
          else
            echo "MAPS_API_KEY secret detected."
          fi
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_PUBLISHABLE_KEY GitHub Secret is not configured. Supabase authentication will not work."
          else
            echo "SUPABASE_PUBLISHABLE_KEY secret detected."
          fi

      - name: Validate toolchain and Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -n "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          gradle :android-app:help --no-daemon --no-configuration-cache --console=plain

      - name: Compile Kotlin sources
        id: kotlin_compile
        shell: bash
        run: |
          set +e
          gradle :android-app:compileDebugKotlin \
            --stacktrace \
            --info \
            --no-daemon \
            --no-configuration-cache \
            --console=plain 2>&1 | tee kotlin-compile.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish Kotlin compiler errors
        if: always()
        shell: bash
        run: |
          {
            echo "## Kotlin compiler diagnostics"
            echo
            if [ -f kotlin-compile.log ]; then
              grep -E '^e: |^w: |^error: |^warning: |^> Task :.* FAILED|^FAILURE: ' kotlin-compile.log | tail -n 200 || true
            else
              echo "kotlin-compile.log was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kotlin diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmax-kotlin-diagnostics-${{ github.run_number }}
          path: kotlin-compile.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble debug APK
        if: steps.kotlin_compile.outputs.status == '0'
        shell: bash
        run: |
          set -o pipefail
          gradle :android-app:clean :android-app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache \
            --console=plain 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmax-gradle-diagnostics-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK
        if: steps.kotlin_compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: steps.kotlin_compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: bmax-native-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 14
