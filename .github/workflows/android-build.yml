name: Smart Biller Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smart-biller-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Validate project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f android-app/build.gradle.kts
          test -f gradle.properties
          test -f android-app/src/main/AndroidManifest.xml
          test -f android-app/src/main/java/id/smartbiller/app/MainActivity.kt

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-37|build-tools;36.0.0'

      - name: Gradle configuration check
        run: |
          gradle help --stacktrace --no-daemon --no-configuration-cache
          gradle :android-app:tasks --stacktrace --no-daemon --no-configuration-cache | grep -E 'assembleDebug|compileDebugKotlin'

      - name: Clean build native debug APK
        run: |
          gradle clean :android-app:assembleDebug --stacktrace --no-daemon --warning-mode all --no-configuration-cache

      - name: Verify APK
        run: |
          test -s android-app/build/outputs/apk/debug/android-app-debug.apk
          sha256sum android-app/build/outputs/apk/debug/android-app-debug.apk
          ls -lh android-app/build/outputs/apk/debug/android-app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-biller-native-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 14
